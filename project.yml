name: CheatSheet
options:
  bundleIdPrefix: com.wesleykeetch
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "13"
    VERSIONING_SYSTEM: apple-generic
targets:
  CheatSheet:
    type: application
    platform: macOS
    info:
      path: CheatSheetApp/Info.plist
      properties:
        CFBundleDisplayName: CheatSheet
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright 2026 Wesley Keetch. All rights reserved."
    sources:
      - path: CheatSheetApp/Sources
      - path: Shared/Sources
      - path: CheatSheetApp/Resources
        type: resources
    dependencies:
      - target: CheatSheetWidgets
        embed: true
    entitlements:
      path: CheatSheetApp/CheatSheet.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - HD39MR492X.com.wesleykeetch.wesleycheatsheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleykeetch.wesleycheatsheet
        PRODUCT_NAME: wesleycheatsheet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: CheatSheetApp/CheatSheet.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HD39MR492X
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  CheatSheetWidgets:
    type: app-extension
    platform: macOS
    info:
      path: CheatSheetWidgets/Info.plist
      properties:
        CFBundleDisplayName: CheatSheet Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: CheatSheetWidgets/Sources
      - path: Shared/Sources/CheatSheetNote.swift
      - path: Shared/Sources/CheatSheetNoteRepository.swift
      - path: Shared/Sources/DisplayLine.swift
      - path: CheatSheetWidgets/Resources
        type: resources
    entitlements:
      path: CheatSheetWidgets/CheatSheetWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - HD39MR492X.com.wesleykeetch.wesleycheatsheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleykeetch.wesleycheatsheet.widgets
        PRODUCT_NAME: wesleycheatsheetWidgets
        CODE_SIGN_ENTITLEMENTS: CheatSheetWidgets/CheatSheetWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HD39MR492X
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  CheatSheetiOSWidgets:
    type: app-extension
    platform: iOS
    info:
      path: CheatSheetWidgets/Info.plist
      properties:
        CFBundleDisplayName: CheatSheet Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: CheatSheetWidgets/Sources
      - path: Shared/Sources/CheatSheetNote.swift
      - path: Shared/Sources/CheatSheetNoteRepository.swift
      - path: Shared/Sources/DisplayLine.swift
      - path: CheatSheetWidgets/Resources
        type: resources
    entitlements:
      path: CheatSheetWidgets/CheatSheetWidgets-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wesleykeetch.wesleycheatsheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleykeetch.wesleycheatsheet.widgets
        PRODUCT_NAME: CheatSheetWidgets
        CODE_SIGN_ENTITLEMENTS: CheatSheetWidgets/CheatSheetWidgets-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HD39MR492X
  CheatSheetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CheatSheetTests/Sources
      - path: Shared/Sources
      - path: CheatSheetApp/Sources/NoteStore.swift
      - path: CheatSheetApp/Sources/ScreenshotDemoContent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleykeetch.wesleycheatsheet.tests
  CheatSheetiOS:
    type: application
    platform: iOS
    info:
      path: CheatSheetApp/iOSInfo.plist
      properties:
        CFBundleDisplayName: CheatSheet
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright 2026 Wesley Keetch. All rights reserved."
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: AccentColor
    sources:
      - path: CheatSheetApp/Sources
      - path: Shared/Sources
      - path: CheatSheetApp/Resources
        type: resources
    dependencies:
      - target: CheatSheetiOSWidgets
        embed: true
    entitlements:
      path: CheatSheetApp/CheatSheet-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wesleykeetch.wesleycheatsheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleykeetch.wesleycheatsheet
        PRODUCT_NAME: CheatSheet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: CheatSheetApp/CheatSheet-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HD39MR492X
        TARGETED_DEVICE_FAMILY: "1,2"
  CheatSheetiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CheatSheetTests/Sources
      - path: Shared/Sources
      - path: CheatSheetApp/Sources/NoteStore.swift
      - path: CheatSheetApp/Sources/ScreenshotDemoContent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleykeetch.wesleycheatsheet.ios.tests
  CheatSheetiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CheatSheetUITests/Sources
    dependencies:
      - target: CheatSheetiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleykeetch.wesleycheatsheet.ios.ui-tests
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  CheatSheet:
    build:
      targets:
        CheatSheet: all
        CheatSheetWidgets: all
        CheatSheetTests: testing
    test:
      targets:
        - CheatSheetTests
    run:
      config: Debug
    archive:
      config: Release
  CheatSheetApp:
    build:
      targets:
        CheatSheet: all
        CheatSheetWidgets: all
    run:
      config: Debug
    archive:
      config: Release
  CheatSheetiOS:
    build:
      targets:
        CheatSheetiOS: all
        CheatSheetiOSWidgets: all
        CheatSheetiOSTests: testing
    test:
      targets:
        - CheatSheetiOSTests
    run:
      config: Debug
    archive:
      config: Release
  CheatSheetiOSUI:
    build:
      targets:
        CheatSheetiOS: all
        CheatSheetiOSWidgets: all
        CheatSheetiOSUITests: testing
    test:
      targets:
        - CheatSheetiOSUITests
    run:
      config: Debug

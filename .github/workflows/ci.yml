name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ios:
    name: iOS Unit Tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          xcode_path=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -n 1)
          test -n "$xcode_path"
          sudo xcode-select -s "$xcode_path"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate project
        run: xcodegen generate --spec project.yml --project . --project-root . --quiet

      - name: Verify project configuration
        run: Scripts/verify-project-config.sh

      - name: Resolve iOS simulator
        id: simulator
        run: |
          set -o pipefail
          udid=$(Scripts/resolve-ios-simulator.sh)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: Run iOS unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CheatSheet.xcodeproj \
            -scheme CheatSheetiOS \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/CheatSheet-iOS-DD" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS UI smoke tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CheatSheet.xcodeproj \
            -scheme CheatSheetiOSUI \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/CheatSheet-iOS-UI-DD" \
            -only-testing:CheatSheetiOSUITests/CheatSheetiOSUITests \
            CODE_SIGNING_ALLOWED=NO

  macos:
    name: macOS Unit Tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          xcode_path=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -n 1)
          test -n "$xcode_path"
          sudo xcode-select -s "$xcode_path"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate project
        run: xcodegen generate --spec project.yml --project . --project-root . --quiet

      - name: Run macOS unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CheatSheet.xcodeproj \
            -scheme CheatSheet \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CheatSheet-macOS-DD" \
            CODE_SIGNING_ALLOWED=NO
